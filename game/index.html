<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>麦麦大亨 · 后厨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23DA291C'/%3E%3Cpath d='M18 26h28l-4 28H22z' fill='%23FFF7EE'/%3E%3Crect x='22' y='10' width='5' height='18' rx='2' fill='%23FFC72C'/%3E%3Crect x='30' y='6' width='5' height='22' rx='2' fill='%23FFC72C'/%3E%3Crect x='38' y='11' width='5' height='17' rx='2' fill='%23FFC72C'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFF7EE; --card:#FFFFFF; --line:#EBDFD0; --line2:#F5EDE3;
  --ink:#2C2118; --dim:#9B8B79; --dimmer:#C4B7A6;
  --red:#DA291C; --red-d:#B01F14; --yellow:#FFC72C; --yellow-d:#E0A800;
  --green:#2E7D32; --green-l:#66BB6A; --green-d:#1F5723;
  --burnt:#4A3B2E; --raw:#EBD3A6;
  --shadow:0 1px 2px rgba(90,70,45,.06),0 6px 16px rgba(90,70,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;
}
#app{height:100%;max-width:960px;margin:0 auto;padding:9px;display:flex;flex-direction:column;gap:7px}

/* ══ HUD ══ */
.hud{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.it{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:4px 10px;font-size:11.5px;color:var(--dim);box-shadow:var(--shadow);
  display:flex;align-items:baseline;gap:5px;
}
.it b{color:var(--ink);font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.it.warn b{color:var(--red)}
.it.good b{color:var(--green)}

/* ══ 面板 ══ */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:7px 8px;display:flex;flex-direction:column;gap:6px;min-height:0;
  box-shadow:var(--shadow);
}
.panel > h3{
  font-size:9.5px;letter-spacing:.15em;color:var(--dimmer);font-weight:700;
  flex:0 0 auto;
}

/* ══ 订单栏 ══ */
#railPanel{flex:0 0 auto}
.rail{
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
  max-height:29vh;overflow-y:auto;overflow-x:hidden;padding:1px;
}
.rail .none{
  width:100%;text-align:center;color:var(--dimmer);font-size:11.5px;padding:14px 0;
}
.tk{
  width:164px;flex:0 0 164px;
  border:1.5px solid var(--line);border-radius:11px;background:#FDFAF5;
  padding:6px 7px;display:flex;flex-direction:column;gap:5px;
  animation:pop .22s cubic-bezier(.2,1.5,.5,1);
  transition:border-color .15s,background .15s,box-shadow .15s;
}
@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fly{to{transform:translateY(-16px) scale(.86);opacity:0}}
.tk.ready{border-color:var(--green-l);background:#F4FCF4;box-shadow:0 0 0 3px rgba(102,187,106,.13)}
.tk.hot{border-color:#E8A0A0;background:#FFF6F4}
.tk.going{animation:fly .3s forwards}

.tk-head{display:flex;align-items:center;gap:5px;height:24px}
.tk-face{width:22px;height:28px;flex:0 0 auto;overflow:hidden}
.tk-face svg{display:block;width:22px;height:28px;margin-top:1px}
.tk-no{font-size:10px;font-weight:800;color:var(--dimmer);letter-spacing:.02em}
.tk-time{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.tk.hot .tk-time{color:var(--red)}

.tk-items{display:flex;flex-direction:column;gap:4px}
.li{
  display:flex;align-items:center;gap:5px;padding:3px 5px;border-radius:7px;
  border:1.5px solid var(--line);background:#fff;transition:all .15s;flex-wrap:wrap;
}
.li svg{width:17px;height:17px;flex:0 0 auto;transition:opacity .15s}
.li .nm{font-size:10.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.li .tp{
  flex:1 0 100%;font-size:8.5px;line-height:1.4;color:var(--dimmer);
  padding-left:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.li.miss{border-style:dashed;background:#FAF6F0}
.li.miss svg{opacity:.3}
.li.miss .nm{color:var(--dim);font-weight:500}
.li.ok{border-color:var(--green-l);background:#F2FBF2}
.li.ok .nm{color:var(--green)}
.li.ok::after{content:'✓';font-size:10px;color:var(--green);font-weight:800}

.tk-pat{height:3.5px;border-radius:2px;background:#EFE5D8;overflow:hidden}
.tk-pat i{display:block;height:100%;width:100%;background:var(--green-l);border-radius:2px}

.tk-go{
  border:none;border-radius:8px;padding:5px 0;width:100%;font-family:inherit;
  font-size:11.5px;font-weight:700;cursor:pointer;
  background:#EFE7DC;color:#B3A491;transition:all .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tk.ready .tk-go{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.tk.ready .tk-go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d)}

/* ══ Tabs ══ */
.tabs{display:flex;gap:5px;flex:0 0 auto}
.tab{
  flex:1;position:relative;border:1.5px solid var(--line);background:var(--card);
  border-radius:11px;padding:5px 2px 6px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:650;color:var(--dim);letter-spacing:.02em;
  transition:all .12s;box-shadow:var(--shadow);
}
.tab svg{width:19px;height:19px;transition:opacity .12s;opacity:.55}
.tab.on{background:#FDF4E3;border-color:var(--yellow-d);color:var(--ink)}
.tab.on svg{opacity:1}
.tab:active{transform:scale(.98)}
.tab .badge{
  position:absolute;top:-6px;right:-5px;min-width:19px;height:19px;padding:0 5px;
  border-radius:10px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-style:normal;
  border:2px solid var(--bg);
}

/* ══ 工位区 ══ */
#bench{flex:1 1 auto;min-height:0;justify-content:center}

/* 选品条 */
.picker{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.pk{
  flex:1 1 0;min-width:0;border:1.5px solid var(--line);background:#FDFAF5;border-radius:9px;
  padding:5px 4px;cursor:pointer;font-family:inherit;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:650;color:var(--dim);transition:all .12s;
}
.pk svg{width:18px;height:18px}
.pk .pr{font-size:9px;color:var(--dimmer);font-weight:500}
.pk:active{transform:scale(.97)}
.pk.on{border-color:var(--yellow-d);background:#FFF9E8;color:var(--ink)}
.pk:disabled{opacity:.4;cursor:default}

/* 薯条站 */
.slots{display:flex;gap:8px;flex:1 1 auto;min-height:150px;max-height:320px}
.slot{
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:13px;
  background:#FDFAF5;padding:8px 7px 7px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  transition:border-color .12s,background .12s,transform .05s;
}
.slot::before{
  content:'';position:absolute;left:0;right:0;bottom:46px;height:34px;
  background:linear-gradient(180deg,rgba(232,168,58,.22),rgba(198,124,26,.30));
  border-top:1.5px solid rgba(198,124,26,.28);
  pointer-events:none;
}
.slotnm{
  position:absolute;top:9px;left:6px;right:6px;text-align:center;
  font-size:10.5px;font-weight:700;color:var(--dim);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slotbig{
  position:absolute;top:38%;left:0;right:0;transform:translateY(-50%);
  text-align:center;font-size:27px;font-weight:800;letter-spacing:-.03em;
  color:#CFC5B4;font-variant-numeric:tabular-nums;pointer-events:none;
}
.slot.ready .slotbig{color:#2E7D20}
.slot.idle .slotbig{font-size:12px;font-weight:600;color:var(--dimmer);letter-spacing:0}
.slot.burnt .slotbig{color:var(--burnt);opacity:.75}
.slot:active{transform:scale(.975)}
.slot.idle{border-style:dashed;background:#FBF6EE;cursor:default}
.slot.frying{border-color:var(--yellow-d);background:#FFFCF2}
.slot.ready{border-color:var(--green-l);background:#F2FBF2;animation:pulse 1s ease-in-out infinite}
.slot.burnt{border-color:#C9BCAE;background:#F7F3EE}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(102,187,106,.34)}50%{box-shadow:0 0 0 6px rgba(102,187,106,0)}}

.frywrap{flex:1 1 auto;min-height:76px;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding-bottom:14px;transition:opacity .15s}
.stick{width:13px;border-radius:6px;background:var(--raw);box-shadow:inset 0 0 0 1px rgba(140,110,70,.4);transition:background .18s}
.slot .lbl{text-align:center;font-size:11px;color:var(--dim);height:17px;font-variant-numeric:tabular-nums}
.slot.ready .lbl{color:var(--green);font-weight:700}
.slot.burnt .lbl{color:var(--burnt);font-weight:700}
.bar{height:5px;border-radius:3px;background:#EFE5D8;margin-top:5px;position:relative;overflow:hidden}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(102,187,106,.3);border-radius:3px}
.bar .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--yellow);border-radius:3px}
.slot.ready .bar .fill{background:#3E8E42}
.slot.burnt .bar .fill{background:var(--burnt)}
.slot .lbl2{text-align:center;font-size:9.5px;color:var(--dimmer);margin-top:3px;height:14px}

/* 炸物站：抖篮窗口 */
.slot.shake{border-color:var(--red);background:#FFF6F4;animation:pulseShake .75s ease-in-out infinite}
@keyframes pulseShake{0%,100%{box-shadow:0 0 0 0 rgba(218,41,28,.34)}50%{box-shadow:0 0 0 7px rgba(218,41,28,0)}}
.slot.shake .slotbig{color:var(--red);font-size:15px;font-weight:800}
.bskwrap{display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:26px;position:relative;z-index:2}
.bskwrap svg{filter:drop-shadow(0 1px 0 rgba(120,90,60,.18))}

/* 煎区 */
.grillbox{display:flex;gap:8px;flex:1 1 auto;min-height:120px;max-height:300px}
.gr{
  flex:1;min-width:0;border:1.5px solid var(--line);border-radius:13px;background:#FDFAF5;
  position:relative;overflow:hidden;cursor:pointer;padding:8px 7px 7px;
  display:flex;flex-direction:column;justify-content:flex-end;
  transition:border-color .12s,background .12s,transform .05s;
}
.gr:active{transform:scale(.975)}
.gr.idle{border-style:dashed;background:#FBF6EE;cursor:default}
.gr.s1{border-color:var(--yellow-d);background:#FFFCF2}
.gr.flip{border-color:var(--red);background:#FFF6F4;animation:pulseShake .8s ease-in-out infinite}
.gr.ready{border-color:var(--green-l);background:#F2FBF2;animation:pulse 1s ease-in-out infinite}
.gr.burnt{border-color:#C9BCAE;background:#F7F3EE}
.gr .griddle{
  position:absolute;left:0;right:0;bottom:46px;height:30px;
  background:linear-gradient(180deg,rgba(140,115,90,.16),rgba(100,78,55,.24));
  border-top:1.5px solid rgba(100,78,55,.26);
}
.gr .patty{
  position:absolute;left:50%;bottom:52px;transform:translateX(-50%);
  width:78%;height:20px;border-radius:10px;
  background:linear-gradient(180deg,#D89A78,#B87550);
  border:1px solid rgba(110,63,31,.32);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.10);
  transition:background .25s,height .25s;
}
.gr .patty::after{
  content:'';position:absolute;inset:5px 8px auto;height:2px;border-radius:2px;
  background:rgba(110,63,31,.28);
  box-shadow:0 5px 0 rgba(110,63,31,.20),0 -6px 0 rgba(110,63,31,.16);
}
.gr .patty.half{background:linear-gradient(180deg,#C08559,#96603A)}
.gr .patty.done{background:linear-gradient(180deg,#A9713F,#7A4A26)}
.gr .patty.burnt{background:linear-gradient(180deg,#4A3527,#2A1C12)}
.gr .grtag{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;color:var(--dim);font-weight:700}
.gr .grbig{
  position:absolute;top:36%;left:0;right:0;transform:translateY(-50%);text-align:center;
  font-size:23px;font-weight:800;color:#CFC5B4;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.gr.ready .grbig{color:#2E7D20;font-size:17px}
.gr.flip .grbig{color:var(--red);font-size:16px}
.gr.idle .grbig{font-size:11.5px;font-weight:600;color:var(--dimmer);letter-spacing:0}
.gr.burnt .grbig{color:var(--burnt);opacity:.8;font-size:17px}
.warm{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:wrap}
.warm .wlbl{font-size:10px;color:var(--dimmer);letter-spacing:.06em}
.warm .wc{
  width:38px;height:32px;border:1.5px dashed var(--line);border-radius:8px;
  background:#FDFAF5;display:flex;align-items:center;justify-content:center;position:relative;
}
.warm .wc.has{border-style:solid;border-color:#C9954F;background:#FFF8EA}
.warm .wc svg{width:24px;height:24px}
.warm .wc .q{
  position:absolute;right:-3px;bottom:-3px;font-size:8.5px;font-weight:800;color:#fff;
  background:var(--green);border-radius:4px;padding:0 3px;line-height:12px;
}

/* 饮料站 */
.drinkwrap{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:2px 0;min-height:0;
}
.machine{
  flex:1 1 auto;width:min(100%,440px);min-height:0;position:relative;
  border:1.5px solid var(--line);border-radius:14px;background:#FFFDF8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 10px 12px;
}
.machine-top{
  position:absolute;top:9px;left:0;right:0;text-align:center;
  font-size:9.5px;letter-spacing:.14em;color:var(--dimmer);font-weight:700;
}
.cupshell{display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.nozzle{
  width:52px;height:22px;background:#D8D2C6;border-radius:7px 7px 4px 4px;
  border:1.5px solid #C6BFB1;border-bottom:none;position:relative;
}
.nozzle::after{
  content:'';position:absolute;top:21px;left:50%;transform:translateX(-50%);
  width:7px;height:9px;background:#BFB8AA;border-radius:0 0 3px 3px;
}
.cup{
  width:148px;height:clamp(200px,32vh,300px);
  border:2px solid var(--line);border-top:none;
  border-radius:5px 5px 26px 26px;position:relative;overflow:hidden;background:#FDFAF5;flex:0 0 auto;
  box-shadow:inset 0 -6px 12px rgba(120,100,70,.06),inset 4px 0 8px rgba(255,255,255,.7);
}
.drip{width:214px;height:10px;border-radius:5px;background:#E4DCCD;margin-top:10px}
/* 不要给液面加 transition：高度每帧都在重新赋值，过渡会不停重启、跟不上真实液位，
   这游戏是按液位判定的，画面不能比状态慢半拍。 */
.cup .liquid{position:absolute;left:0;right:0;bottom:0;height:0}
.cup .liquid::after{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:rgba(255,255,255,.45);
}
.cup .goal{
  position:absolute;left:0;right:0;
  background:rgba(102,187,106,.2);
  border-top:1.5px dashed rgba(46,125,32,.55);
  border-bottom:1.5px dashed rgba(46,125,32,.55);
}
.cup-mark{position:absolute;right:-40px;font-size:9px;color:var(--dimmer);transform:translateY(50%)}
.drinkwrap .tap{
  width:min(340px,86%);border:1.5px solid var(--line);background:#FDFAF5;border-radius:13px;
  padding:13px 8px;text-align:center;cursor:pointer;font-size:15px;color:var(--dim);
  font-weight:700;transition:transform .05s,background .12s,border-color .12s;
  display:flex;flex-direction:column;gap:3px;align-items:center;flex:0 0 auto;
}
.tap:active,.tap.on{background:#FFF3D6;border-color:var(--yellow-d);transform:scale(.985)}
.tap b{font-size:11px;color:var(--dimmer);font-weight:500}
.tap.ready{border-color:var(--green-l);background:#F2FBF2;color:var(--green)}
.tap.ready b{color:var(--green)}

/* 组装站 */
.pstock{
  float:right;display:inline-flex;align-items:center;gap:3px;letter-spacing:0;
  font-size:9.5px;font-weight:700;color:var(--dim);background:#FDFAF5;
  border:1px solid var(--line);border-radius:20px;padding:1px 7px 1px 3px;
}
.pstock svg{width:14px;height:14px}
.pstock.out{color:var(--red);border-color:#E8A0A0;background:#FFF6F4}
.asm{flex:1 1 auto;display:flex;gap:10px;min-height:0}
.asm-left{
  flex:0 0 42%;min-width:172px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1.5px solid var(--line);border-radius:12px;background:#FDFAF5;padding:8px 8px 26px;position:relative;
  overflow:hidden;
}
.asm-left::after{
  content:'';position:absolute;left:12%;right:12%;bottom:0;height:7px;
  background:#E4DCCD;border-radius:6px 6px 0 0;
}
.asm-tag{
  position:absolute;top:8px;left:0;right:0;text-align:center;
  font-size:10.5px;color:var(--dim);letter-spacing:.02em;font-weight:650;
}
.asm-cnt{
  position:absolute;bottom:12px;left:0;right:0;text-align:center;
  font-size:10px;color:var(--dimmer);font-variant-numeric:tabular-nums;
}
/* 汉堡叠层：column-reverse —— DOM 里第一个元素在最下面（面包底），往上越堆越高。
   每种配料按形状给不同高度/宽度/圆角，光靠颜色区分的话酱和面包底会糊成一片。 */
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:0;width:100%;padding-bottom:24px}
.layer{
  height:14px;border-radius:7px;width:92%;position:relative;
  box-shadow:inset 0 0 0 1px rgba(120,95,60,.20),inset 0 -2px 0 rgba(0,0,0,.07);
  animation:drop .16s ease-out;
}
.layer.s-blob{height:13px;border-radius:9px}
.layer.s-cheese{height:11px;width:96%;border-radius:3px}
.layer.s-leaf{height:16px;width:100%;border-radius:5px 5px 10px 10px}
.layer.s-pickle{height:12px;width:86%;border-radius:9px}
.layer.s-dice{height:11px;width:84%;border-radius:9px}
.layer.ghost{
  background:transparent!important;box-shadow:none;border:1.5px dashed #DFD3C2;
  opacity:.75;animation:none;
}
@keyframes drop{from{transform:translateY(-14px);opacity:.2}to{transform:translateY(0);opacity:1}}
.bun{
  height:25px;width:96%;background:#E0B075;
  border-radius:6px 6px 17px 17px;
  box-shadow:inset 0 0 0 1px #C9954F,inset 0 4px 0 rgba(255,255,255,.3);
}
.bun.top{
  height:29px;border-radius:17px 17px 6px 6px;background:#E8BE85;position:relative;
  box-shadow:inset 0 0 0 1px #C9954F,inset 0 -3px 0 rgba(0,0,0,.05);
}
.bun.top::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    radial-gradient(circle 1.6px at 26% 52%,#FFF6E0 100%,transparent 0),
    radial-gradient(circle 1.6px at 46% 34%,#FFF6E0 100%,transparent 0),
    radial-gradient(circle 1.6px at 66% 58%,#FFF6E0 100%,transparent 0),
    radial-gradient(circle 1.4px at 82% 40%,#FFF6E0 100%,transparent 0);
}
.asm-right{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-width:0}
.asm-ticket{
  flex:0 0 auto;border:1.5px solid var(--line);border-radius:10px;background:#FDFAF5;
  padding:8px 10px;display:flex;flex-direction:column;gap:5px;
}
.asm-ticket .ttl{font-size:12px;font-weight:750;display:flex;align-items:center;gap:6px}
.asm-ticket .ttl svg{width:17px;height:17px}
.asm-ticket .sub2{font-size:9.5px;color:var(--dimmer)}
.need{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.need span{
  font-size:10px;padding:2px 7px 2px 3px;border-radius:20px;background:#fff;
  border:1px solid var(--line);color:var(--dim);transition:all .15s;
  display:flex;align-items:center;gap:4px;
}
.need span i{
  width:14px;height:14px;border-radius:50%;background:var(--line2);color:var(--dim);
  font-size:8.5px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.need span.done{background:#EDF7ED;border-color:var(--green-l);color:var(--green);text-decoration:line-through}
.need span.done i{background:var(--green);color:#fff}
.need span.next{border-color:var(--yellow-d);background:#FFF9E8;color:var(--ink);font-weight:700}
.need span.next i{background:var(--yellow-d);color:#fff}
.asm-pal{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.pal-ttl{font-size:9.5px;color:var(--dimmer);letter-spacing:.08em}
.ingr{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1 1 auto;align-content:start;overflow-y:auto}
.ig{
  border:1.5px solid var(--line);background:#fff;border-radius:9px;
  padding:9px 10px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:650;color:var(--ink);
  display:flex;align-items:center;gap:6px;transition:all .1s;text-align:left;
}
.ig svg{width:16px;height:16px;flex:0 0 auto}
.ig:active{transform:scale(.96)}
.ig:hover{border-color:var(--yellow-d)}
.ig.fin{
  grid-column:1/-1;justify-content:center;font-weight:800;font-size:12px;
  background:var(--red);border-color:var(--red);color:#fff;padding:11px;
}
.ig.fin:disabled{background:#EFE7DA;border-color:#E2D8C8;color:var(--dimmer);cursor:default}
.ig.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.asm-void{
  flex:1;display:flex;flex-direction:column;gap:10px;min-height:0;justify-content:center;
}
.asm-void .bv-grid{align-content:center}
.idle-note{text-align:center;color:var(--dimmer);font-size:11.5px;padding:2px}
.idle-note b{color:var(--dim)}
.bv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;overflow-y:auto}
.bv{
  border:1.5px solid var(--line);border-radius:11px;background:#FDFAF5;
  padding:9px 10px;display:flex;flex-direction:column;gap:2px;
}
.bv-ic{height:26px;display:flex;align-items:center}
.bv-nm{font-size:11.5px;font-weight:750;color:var(--ink)}
.bv-pr{font-size:10px;color:var(--dim)}
.bv-tp{font-size:9px;color:var(--dimmer);line-height:1.55;margin-top:2px}
.asm-empty b{color:var(--dim);font-size:12.5px;font-weight:700}

/* ══ 出餐架 ══ */
#shelfPanel{flex:0 0 auto}
.shelf{display:flex;gap:6px;flex-wrap:wrap}
.sh{
  width:36px;height:36px;border:1.5px dashed var(--line);border-radius:9px;
  background:#FDFAF5;display:flex;align-items:center;justify-content:center;
  transition:all .12s;position:relative;
}
.sh.has{border-style:solid;border-color:var(--yellow-d);background:#FFFBEE;cursor:pointer}
.sh.has:active{transform:scale(.93)}
.sh svg{width:22px;height:22px}
.sh .q{position:absolute;right:-3px;bottom:-3px;font-size:8.5px;font-weight:800;color:#fff;
  background:var(--green);border-radius:4px;padding:0 3px;line-height:12px}
.shelf-note{margin-left:auto;font-size:10.5px;color:var(--dimmer);align-self:center}

/* ══ 顾客 / 飘字 / 提示 ══ */
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}
.pop{position:fixed;font-size:16px;font-weight:800;pointer-events:none;z-index:99;
  animation:rise .85s ease-out forwards;text-shadow:0 1px 0 #fff,0 0 8px #fff}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:rgba(44,33,24,.92);color:#fff;padding:8px 18px;border-radius:20px;
  font-size:13px;z-index:100;pointer-events:none;animation:tst 1.4s forwards;
  max-width:88vw;text-align:center;
}
@keyframes tst{0%{opacity:0;transform:translate(-50%,8px)}15%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}

/* ══ 按钮 / 面板页 ══ */
.btn{
  border:none;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:transform .06s,filter .12s;
  background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-d)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--red-d)}
.sheet{
  flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:15px;padding:18px;text-align:center;overflow-y:auto;
}
.sheet h1{font-size:25px;font-weight:800;letter-spacing:-.02em}
.sheet .sub{color:var(--dim);font-size:13.5px;max-width:440px;line-height:1.75}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px 18px;width:100%;max-width:420px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:11px;
}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:3px 2px}
.row .k{color:var(--dim)}
.row .v{font-weight:650;font-variant-numeric:tabular-nums}
.row.big{font-size:15px;padding-top:10px;border-top:1.5px solid var(--line2)}
.row.big .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.v.pos{color:var(--green)} .v.neg{color:var(--red)}
.grade{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hint{font-size:12px;color:var(--dimmer);max-width:430px;line-height:1.75}
.legend{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.src{font-size:10.5px;color:var(--dimmer);text-align:center;line-height:1.7}
.src b{color:var(--dim);font-weight:600}

@media(max-width:600px){
  .tk{width:calc(50% - 4px);flex:0 0 calc(50% - 4px)}
  .cup{width:92px;height:clamp(140px,22vh,180px)}
  .asm{gap:7px}
  .asm-left{flex:0 0 40%;min-width:120px}
  .bv-grid{grid-template-columns:repeat(2,1fr)}
  .slotbig{font-size:22px}
}
</style>
</head>

/* 注杯速度从 1650ms 放到 2000ms：绿区按比例算，1650ms 时完美带只有 84ms，
   比薯条的 292ms 窄了三倍半 —— 那不是"严格"，那是不公平。放到 2000ms 后是 111ms。 */
var GRILL  = { slots: 3, sideMs: 2500, readyAt: 0.58, warmCap: 4 };  // 煎区：每面 58% 后翻面/起锅

   绿区只是个"有效窗口"。进绿区就有分，但只有正中那一下才算真的做对了。
   曲线是两段式：中点附近扣得极少（给"手稳"的人留出可达的满分带），

var Q_CORE  = 0.18;   // 完美带的半宽（占绿区半宽的比例），带内几乎不扣分
var Q_SLOPE = 1.55;   // 带外的掉分斜率：d 每多 0.1 分，质量掉 0.155
function qScore(d){
  d = clamp(d, 0, 1);
  if(d <= Q_CORE) return 1 - d * 0.20;
  return clamp(1 - Q_CORE * 0.20 - (d - Q_CORE) * Q_SLOPE, 0.08, 1);
}
var PERFECT_Q = 0.90;       // 完美出品线（原 0.85）——现在是真难
var GOOD_Q    = 0.70;       // "还像样"线（原 0.55）
var SHELF_CAP = 8;
var MAX_ORDERS = 7;

var TIP_TIERS = [
  { q: 0.90, rate: 0.12, tag: '完美', col: '#1F5723' },
  { q: 0.75, rate: 0.05, tag: '不错', col: '#2E7D32' },
  { q: 0.60, rate: 0.02, tag: '凑合', col: '#E0A800' },
  { q: 0,    rate: 0,    tag: '糊弄', col: '#DA291C' }
];
function tipTier(q){
  for(var i = 0; i < TIP_TIERS.length; i++) if(q >= TIP_TIERS[i].q) return TIP_TIERS[i];
  return TIP_TIERS[TIP_TIERS.length - 1];
}

var TOPPING_STYLE = {
  '巨无霸酱':   { c:'#C8642B', s:'blob' },
  '烤味酱':     { c:'#8C4A2F', s:'blob' },
  '麦香鸡酱':   { c:'#E0A03A', s:'blob' },
  '麦香鱼酱':   { c:'#EBC96A', s:'blob' },
  '番茄酱':     { c:'#C92D1E', s:'blob' },
  '芥末酱':     { c:'#D9B520', s:'blob' },
  '吉士':       { c:'#FFC72C', s:'cheese' },
  '生菜':       { c:'#4E9B3E', s:'leaf' },
  '切块生菜':   { c:'#4E9B3E', s:'leaf' },
  '酸黄瓜':     { c:'#7BA05B', s:'pickle' },
  '洋葱粒':     { c:'#C9A8C4', s:'dice' }
};
function toppingStyle(n){

/* ════════════════ 音效 ════════════════ */
var AC = null;
function beep(freq, dur, type, vol){
  if(!audioOn) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, AC.currentTime);
    g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}

function sfxBad(){ beep(150,.22,'sawtooth',.04); }

/* 真实菜单里有 ¥9.5 / ¥14.5 / ¥22.5，四舍五入成整数就把"真实价格"这个卖点丢了。
   有小数就显示一位，整数就不带尾巴。 */
function yen(n){
  var v = Math.round(n * 10) / 10;
  return '¥' + (Math.abs(v - Math.round(v)) < 0.05 ? Math.round(v) : v.toFixed(1));
}
function signedYen(n){
  var v = Math.round(n * 10) / 10, a = Math.abs(v);
  var body = Math.abs(a - Math.round(a)) < 0.05 ? String(Math.round(a)) : a.toFixed(1);
  return (v > 0 ? '+' : v < 0 ? '-' : '') + '¥' + body;
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

var _toastAt = {};
function toast(msg){
  var now = Date.now();
  if(_toastAt[msg] && now - _toastAt[msg] < 800) return;
  _toastAt[msg] = now;
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 1400);
}
function popText(x, y, text, color){
  var p = document.createElement('div');
  p.className = 'pop'; p.textContent = text;
  p.style.color = color;
  p.style.left = (x - 16) + 'px'; p.style.top = (y - 10) + 'px';
  document.body.appendChild(p);
  setTimeout(function(){ if(p.parentNode) p.remove(); }, 860);
}

/* ════════════════ 一天配置 ════════════════ */
function dayCfg(day){
  return {
    /* 客流和耐心维持上一版：这轮的"严格"加在判定和小费上，不再叠时间压力。
       实测把耐心砍到 18s→12s 时，240ms 反应档的机器人第 3 天就崩（服务率 27%），
       那不是难，那是没得玩。 */
    interval: Math.max(4000, 5600 - (day-1) * 350),      // 5.6s → 4.0s
    patience: Math.max(14000, 22000 - (day-1) * 1600),   // 22s → 14s
    duration: ECON.dayMs || 60000
  };
}

/* 生成一张订单：1~3 件，菜品与配料全部来自真实菜单 */
function makeOrderWant(day){
  var r = Math.random(), n;
  if(day <= 1)      n = 1;
  else if(day <= 2) n = r < 0.62 ? 1 : 2;
  else if(day <= 4) n = r < 0.46 ? 1 : (r < 0.92 ? 2 : 3);
  else              n = r < 0.34 ? 1 : (r < 0.88 ? 2 : 3);

  var fry = dishesOf('fries'), bsk = dishesOf('basket'),
      drk = dishesOf('drink'), asm = dishesOf('assembly');
  var want = [];
  for(var i = 0; i < n; i++){
    var roll = Math.random();
    var pool = roll < 0.20 ? fry : roll < 0.38 ? bsk : roll < 0.64 ? drk : asm;
    if(!pool.length) pool = Object.keys(DISH);
    var code = pool[(Math.random() * pool.length) | 0];
    var d = DISH[code];
    var toppings = null;
    if(d.station === 'assembly' && d.recipe && d.recipe.length){
      toppings = d.recipe.slice();
      // 20% 的顾客会挑掉一项配料（"不要酸黄瓜"）
      if(Math.random() < 0.20 && toppings.length > 1){
        toppings.splice((Math.random() * toppings.length) | 0, 1);
      }
    }
    want.push({ code: code, toppings: toppings });
  }
  return want;
}

/* 票面上还有多少件这个工位的东西没着落（不算出餐架已有） */
function countPending(station){
  var need = 0;
  S.orders.forEach(function(o){
    o.want.forEach(function(w){
      if(DISH[w.code] && DISH[w.code].station === station) need++;
    });
  });
  return need;
}
function pendingOfStation(station){
  if(station === 'grill'){
    // 煎区不产出菜品，只产出肉饼：待做的堡 − 架上已做好的堡 − 保温盘里的肉饼
    // 注意需求要按组装站数，不能按 grill 自己的菜品数（那永远是 0）
    var made = 0;
    S.shelf.forEach(function(x){
      if(DISH[x.code] && DISH[x.code].station === 'assembly') made++;
    });
    return Math.max(0, countPending('assembly') - made - S.patties.length);
  }
  var need = countPending(station);
  var have = 0;
  S.shelf.forEach(function(x){
    if(DISH[x.code] && DISH[x.code].station === station) have++;
  });
  return Math.max(0, need - have);
}
function paintBadges(){
  STATIONS.forEach(function(d){
    var node = el('bd-' + d.key);
    if(!node) return;
    var n = pendingOfStation(d.key);
    if(n > 0){ node.style.display = ''; if(node.textContent !== String(n)) node.textContent = n; }
    else node.style.display = 'none';
  });
}

function paintBasket(){
  for(var i = 0; i < S.baskets.length; i++){
    var s = S.baskets[i];
    var node = app.querySelector('[data-bs="' + i + '"]');
    if(!node) continue;
    var ratio = s.st === 'burnt' ? 1 : clamp(s.t / BASKET.ms, 0, 1);
    var fill = node.querySelector('.fill');
    if(fill) fill.style.width = (ratio * 100) + '%';
    var wrap = node.querySelector('.frywrap');
    var nm = s.code && DISH[s.code] ? (DISH[s.code].short || '') : '';

    // 图标只在状态/选品变化时重建，别每帧 innerHTML
    var wrapSig = (s.st === 'idle' ? 'idle' : s.code + '|' + s.st);
    if(wrap && wrap._sig !== wrapSig){
      wrap._sig = wrapSig;
      wrap.innerHTML = s.st === 'idle' ? '' :
        [0,1,2,3].map(function(i){
          return '<i style="display:block;transform:translateY(' + (i % 2 ? -7 : 0) + 'px)">' +
            dishIcon(s.code, 40) + '</i>';
        }).join('');
    }
    if(wrap) wrap.style.opacity = (s.st === 'idle') ? '0.26' : '1';

    // 炸物颜色跟着走一档，生→金黄→焦
    var icons = node.querySelectorAll('.frywrap svg');
    var tint = s.st === 'burnt' ? 0.42 : (s.st === 'frying' && ratio >= BASKET.rawUntil ? 1 : 0.88);
    for(var k = 0; k < icons.length; k++) icons[k].style.opacity = String(tint);

    var snm = node.querySelector('.slotnm'), sbig = node.querySelector('.slotbig');
    var lbl = node.querySelector('.lbl'), lbl2 = node.querySelector('.lbl2');
    var cls = 'slot';
    if(snm) snm.textContent = (s.st === 'idle') ? '' : nm;

    if(s.st === 'idle'){
      cls += ' idle';
      if(sbig) sbig.textContent = '点一下下料';
      if(lbl) lbl.textContent = '空';
      if(lbl2) lbl2.textContent = '从上面选品';
    } else if(s.st === 'frying'){
      if(!s.shook && ratio >= BASKET.shakeFrom && ratio < BASKET.shakeTo){
        cls += ' shake';
        if(sbig) sbig.textContent = '抖篮！';
        if(lbl) lbl.textContent = '要粘连了';
        if(lbl2) lbl2.textContent = nm + ' · 点一下抖开';
      } else if(ratio < BASKET.rawUntil){
        cls += ' frying';
        if(sbig) sbig.textContent = ((BASKET.ms - s.t) / 1000).toFixed(1) + 's';
        if(lbl) lbl.textContent = nm + (s.shook ? ' 已抖' : ' 未抖');
        if(lbl2) lbl2.textContent = s.shook ? '等绿区' : '还没定型';
      } else {
        cls += ' ready';
        if(sbig) sbig.textContent = '捞出';
        if(lbl) lbl.textContent = '可以捞！';
        if(lbl2) lbl2.textContent = nm + (s.shook ? ' · 抖过了' : ' · 没抖，粘连');
      }
    } else {
      cls += ' burnt';
      if(sbig) sbig.textContent = '焦';
      if(lbl) lbl.textContent = '焦了';
      if(lbl2) lbl2.textContent = nm + ' · 点一下清篮';
    }
    if(node.className !== cls) node.className = cls;
  }
}
function fireBasket(code){
  var d = DISH[code];
  if(!d) return;
  var idx = -1;
  for(var i = 0; i < S.baskets.length; i++) if(S.baskets[i].st === 'idle'){ idx = i; break; }
  if(idx < 0){ toast('两个炸篮都在忙'); sfxBad(); return; }
  if(S.cash < d.cost){ toast('现金不够进货了'); sfxBad(); return; }
  S.cash -= d.cost; S.stats.cost += d.cost;
  S.baskets[idx].st = 'frying';
  S.baskets[idx].t = 0;
  S.baskets[idx].code = code;
  S.baskets[idx].shook = false;
  sfxClick(); paint();
}
function clickBasket(i){
  var s = S.baskets[i]; if(!s) return;
  if(s.st === 'idle'){ if(picked.basket) fireBasket(picked.basket); return; }
  if(s.st === 'burnt'){
    s.st = 'idle'; s.t = 0; s.code = null; s.shook = false;
    S.stats.burnt++; sfxBad(); paint(); return;
  }
  var r = s.t / BASKET.ms;
  // 抖篮窗口内点一下：抖开，不粘连
  if(!s.shook && r >= BASKET.shakeFrom && r < BASKET.shakeTo){
    s.shook = true;
    sfxGood(); toast('抖开了，不会粘连');
    paint(); return;
  }
  if(r < BASKET.rawUntil){
    s.st = 'idle'; s.t = 0; s.code = null; s.shook = false;
    S.stats.wasted++; sfxBad();
    toast(r < BASKET.shakeFrom ? '还没炸透，扔了' : '来不及抖了，这篮废了');
    paint(); return;
  }
  var lo = BASKET.rawUntil, mid = (lo + 1) / 2;
  var q = qScore(Math.abs(r - mid) / (mid - lo));
  if(!s.shook) q = Math.min(q, 0.35);          // 没抖篮 → 粘成一坨，卖不上价
  var code = s.code;
  s.st = 'idle'; s.t = 0; s.code = null; s.shook = false;
  putOnShelf(code, q, null);
  sfxGood(); paint();
}

function qualityGrill(r){
  var lo = GRILL.readyAt, mid = (lo + 1) / 2;
  return qScore(Math.abs(r - mid) / (mid - lo));
}
function clickGrill(i){
  var g = S.grill[i]; if(!g) return;
  if(g.st === 'idle'){
    g.st = 'cook'; g.t = 0; g.side = 1; g.q1 = 1;
    sfxClick(); paint(); return;
  }
  if(g.st === 'burnt'){
    g.st = 'idle'; g.t = 0; g.side = 1;
    S.stats.burnt++; sfxBad(); paint(); return;
  }
  var r = g.t / GRILL.sideMs;
  if(r < GRILL.readyAt){ toast('还没到火候，再煎一会儿'); sfxBad(); return; }
  if(g.side === 1){
    g.q1 = qualityGrill(r);
    g.side = 2; g.t = 0;
    sfxGood(); toast('翻面');
    paint(); return;
  }
  var q = (g.q1 + qualityGrill(r)) / 2;
  g.st = 'idle'; g.t = 0; g.side = 1;
  addPatty(q);
  sfxGood(); paint();
}
function addPatty(q){
  if(S.patties.length >= GRILL.warmCap){
    toast('保温盘满了，这块肉饼只能扔');
    S.stats.wasted++; sfxBad(); return;
  }
  S.patties.push({ q: q, born: S.tNow });
  paintWarm();
}
/* 保鲜：出锅 9 秒后开始掉质量 */
function freshMul(born){
  var held = S.tNow - (born || 0);
  if(held <= FRESH.grace) return 1;
  return clamp(1 - (held - FRESH.grace) / 1000 * FRESH.rate, FRESH.floor, 1);
}
function effQ(it){
  return clamp((it.q || 0) * freshMul(it.born || 0), 0.05, 1);
}

      var w = o.want[j], d = DISH[w.code];

      for(var k = 0; k < S.shelf.length; k++){

/* ════════════════ 绑定 ════════════════ */
function bindStatic(){
  el('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-tab]'); if(!b) return;
    var k = b.getAttribute('data-tab');
    if(k === S.tab) return;
    if(S.cup.pouring){ S.cup.pouring = false; finishPour(); }
    S.tab = k; sfxClick();
    renderTabs(); renderBench(); paint();
  });

  var bench = el('bench');
  bench.addEventListener('click', function(e){
    var pk = e.target.closest('[data-pick]');
    if(pk){
      var k = pk.getAttribute('data-pick');
      var station = DISH[k] ? DISH[k].station : null;
      if(station){
        // 只更新选中态。绝不能用 renderBench() 重建工位——
        // 那会把正在计时的油槽/正在注的杯全销毁重建，玩家刚点下去的操作直接失效
        picked[station] = k;
        [].forEach.call(bench.querySelectorAll('#pick-' + station + ' .pk'), function(n){
          n.classList.toggle('on', n.getAttribute('data-pick') === k);
        });
        if(station === 'drink'){
          var fill = el('cupFill');
          if(fill) fill.style.background = CUP_COLOR[k] || '#3D2416';
          if(!S.cup.pouring){
            var tap = el('tap');
            if(tap) tap.innerHTML = '按住注杯 <b>绿区松手 · ' + esc((DISH[k] && DISH[k].short) || '') + '</b>';
          }
        }
        sfxClick();
      }
      return;
    }
    var slot = e.target.closest('[data-slot]');
    if(slot){ clickSlot(+slot.getAttribute('data-slot')); return; }
    var bs = e.target.closest('[data-bs]');
    if(bs){ clickBasket(+bs.getAttribute('data-bs')); return; }
    var gr = e.target.closest('[data-gr]');
    if(gr){ clickGrill(+gr.getAttribute('data-gr')); return; }
    var ig = e.target.closest('[data-ig]');
    if(ig){ addIngredient(ig.getAttribute('data-ig'), ig); return; }
    if(e.target.closest('#fin')){ finishBurger(); return; }
  });

  el('shelf').addEventListener('click', function(e){
    var c = e.target.closest('[data-sh]'); if(!c) return;
    var i = +c.getAttribute('data-sh');
    if(!S.shelf[i]) return;
    S.shelf.splice(i, 1); S.stats.wasted++;
    sfxBad();
    popText(e.clientX, e.clientY, '丢掉了', COL.red);
    renderShelf(); paint();
    if(S.tab === 'assembly') renderBench();
  });

  el('rail').addEventListener('click', function(e){
    var b = e.target.closest('[data-go]'); if(!b) return;
    e.stopPropagation();
    serve(+b.getAttribute('data-go'), e.clientX, e.clientY);
  });
}
function bindDrink(){
  var tap = el('tap'); if(!tap) return;
  tap.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if(S.cup.pouring) return;
    var code = picked.drink; var d = DISH[code];
    if(!d) return;
    if(S.cash < d.cost){ toast('现金不够进货了'); sfxBad(); return; }
    S.cash -= d.cost; S.stats.cost += d.cost;
    S.cup.pouring = true; S.cup.fill = 0; S.cup.code = code;
    tap.classList.add('on');
  });
}

/* ── 油锅 ── */
function fireFryer(code){
  var d = DISH[code];
  if(!d) return;
  var idx = -1;
  for(var i = 0; i < S.slots.length; i++) if(S.slots[i].st === 'idle'){ idx = i; break; }
  if(idx < 0){ toast('三个锅都在忙'); sfxBad(); return; }
  if(S.cash < d.cost){ toast('现金不够进货了'); sfxBad(); return; }
  S.cash -= d.cost; S.stats.cost += d.cost;
  S.slots[idx].st = 'frying';
  S.slots[idx].t = 0;
  S.slots[idx].code = code;
  sfxClick(); paint();
}
function clickSlot(i){
  var s = S.slots[i]; if(!s) return;
  if(s.st === 'idle'){ if(picked.fries) fireFryer(picked.fries); return; }
  if(s.st === 'frying'){
    var r = s.t / FRYER.ms;
    if(r < FRYER.rawUntil){
      s.st = 'idle'; s.t = 0; s.code = null;
      S.stats.wasted++; sfxBad(); toast('还没炸透，扔了');
      paint(); return;
    }
    var q = qualityFries(r), code = s.code;
    s.st = 'idle'; s.t = 0; s.code = null;
    putOnShelf(code, q, null);
    sfxGood(); paint();
    return;
  }
  if(s.st === 'burnt'){
    s.st = 'idle'; s.t = 0; s.code = null;
    S.stats.burnt++; sfxBad();
    paint(); return;
  }
}
function qualityFries(ratio){
  var lo = FRYER.rawUntil, mid = (lo + 1) / 2;
  return qScore(Math.abs(ratio - mid) / (mid - lo));
}

/* ── 饮料 ── */
function finishPour(){
  var cup = el('cupFill'), tap = el('tap');
  if(cup) cup.style.height = '0px';
  if(tap){ tap.className = 'tap'; tap.removeAttribute('data-m'); }
  var f = S.cup.fill, code = S.cup.code;
  S.cup.fill = 0; S.cup.code = null;
  if(f < DRINK.low){ if(f > 0.04){ S.stats.wasted++; sfxBad(); toast('没打满，倒了'); } return; }
  if(f > DRINK.high){ S.stats.wasted++; sfxBad(); toast('溢出来了'); return; }
  var lo = DRINK.low, hi = DRINK.high, mid = (lo + hi) / 2;
  var q = qScore(Math.abs(f - mid) / (hi - lo) * 2);
  if(code) putOnShelf(code, q, null);
  sfxGood();
}

/* ── 组装 ── */
function addIngredient(name, node){
  if(!S.build) return;
  var t = activeBuildTicket();
  if(!t || S.build.key !== (t.order.id + ':' + t.idx)) return;
  var need = t.toppings;
  if(S.build.added.length >= need.length){ toast('配料齐了，合上吧'); return; }
  if(name === need[S.build.added.length]){
    S.build.added.push(name);
    sfxClick();
    renderBench();
    var n = el('fin');
    // 配料齐了不代表能出餐：煎区没肉饼时按钮必须保持禁用，否则玩家点下去只会空转
    if(S.build && S.build.added.length === need.length && n && S.patties.length) n.disabled = false;
  } else {
    S.build.errors++;
    sfxBad();
    toast('顺序不对，单子上写着呢');
    if(node){ node.classList.add('shake'); setTimeout(function(){ node.classList.remove('shake'); }, 320); }
    if(S.build.errors >= 2){
      S.stats.wasted++;
      toast('连错两次，这堡废了，重来');
      S.build = null;
      renderBench();
    }
  }
}
function finishBurger(){
  var t = activeBuildTicket();
  if(!t || !S.build) return;
  var need = t.toppings;
  if(S.build.added.length < need.length){ toast('还差配料'); sfxBad(); return; }
  if(!S.patties.length){ toast('保温盘没肉饼了，先去煎区'); sfxBad(); return; }
  var d = DISH[t.code];
  if(d && S.cash < d.cost){ toast('现金不够进货了'); sfxBad(); return; }
  var topQ = clamp(1 - S.build.errors * 0.45, 0.05, 1);
  var patty = S.patties.shift();
  // 堡的质量 = 配料（手稳）+ 肉饼（火候）各占一部分，两头都得做好
  var q = clamp(0.58 * topQ + 0.42 * effQ(patty), 0.05, 1);
  var code = t.code, tp = need.slice();
  if(d){ S.cash -= d.cost; S.stats.cost += d.cost; }
  S.build = null;
  putOnShelf(code, q, tp);
  sfxGood();
  renderBench();
}

/* ── 出餐架 ── */
function putOnShelf(code, q, toppings){
  if(S.shelf.length >= SHELF_CAP){
    S.stats.wasted++;
    toast('出餐架满了，这份扔了');
    sfxBad();
    return;
  }
  S.shelf.push({ code: code, q: q, sig: sig(toppings), toppings: toppings || null, born: S.tNow });
  renderShelf(); paint();
  if(S.tab === 'assembly') renderBench();
}
function renderShelf(){
  var sh = el('shelf'); if(!sh) return;
  var h = '';
  for(var i = 0; i < SHELF_CAP; i++){
    var it = S.shelf[i];
    h += '<div class="sh' + (it ? ' has' : '') + '"' + (it ? ' data-sh="' + i + '"' : '') + '>' +
      (it ? dishIcon(it.code, 22) : '') +
      (it ? '<span class="q">' + Math.round(effQ(it) * 100) + '</span>' : '') + '</div>';
  }
  h += '<span class="shelf-note">' + S.shelf.length + '/' + SHELF_CAP + '　点一下丢掉</span>';
  sh.innerHTML = h;
  paintShelf();
}
/* 每帧刷一遍架上的新鲜度角标：凉了的变黄/变红 */
function paintShelf(){
  for(var i = 0; i < S.shelf.length; i++){
    var it = S.shelf[i];
    var node = app.querySelector('[data-sh="' + i + '"] .q');
    if(!node) continue;
    var q = effQ(it);
    var txt = String(Math.round(q * 100));
    if(node.textContent !== txt) node.textContent = txt;
    var col = q >= PERFECT_Q ? COL.green : q >= GOOD_Q ? COL.yellowD : COL.red;
    if(node._c !== col){ node._c = col; node.style.background = col; }
  }
}

/* ── 订单匹配 ── */
function matchOrder(o){
  var pool = S.shelf.slice();
  return o.want.map(function(w){
    var i = -1;
    for(var k = 0; k < pool.length; k++){
      if(pool[k].code === w.code && pool[k].sig === sig(w.toppings)){ i = k; break; }
    }
    if(i >= 0){ var it = pool.splice(i, 1)[0]; return { ok: true, code: w.code, q: it.q }; }
    return { ok: false, code: w.code };
  });
}
function missText(m){
  var cnt = {};
  m.forEach(function(x){ if(!x.ok) cnt[x.code] = (cnt[x.code] || 0) + 1; });
  var parts = Object.keys(cnt).map(function(k){
    return cnt[k] + ' ' + ((DISH[k] && (DISH[k].short || DISH[k].name)) || k);
  });
  return parts.length ? ('缺 ' + parts.join(' ')) : '出餐';
}

/* ── 订单栏 ── */
function orderItemsHTML(o){
  return o.want.map(function(w){
    var d = DISH[w.code] || { name: w.code, short: w.code };
    var tp = w.toppings && w.toppings.length ? w.toppings.join('·') : '';
    return '<div class="li miss" data-w="' + w.code + '">' +
      dishIcon(w.code, 17) +
      '<span class="nm">' + esc(d.short || d.name) + '</span>' +
      (tp ? '<span class="tp">' + esc(tp) + '</span>' : '') +
    '</div>';
  }).join('');
}
function syncOrders(){
  var rail = el('rail'); if(!rail) return;
  var seen = {};
  S.orders.forEach(function(o){
    seen[o.id] = 1;
    var e = tkEls[o.id];
    if(!e){
      e = document.createElement('div');
      e.className = 'tk';
      e.setAttribute('data-tk', String(o.id));
      e.innerHTML =
        '<div class="tk-head">' +
          '<span class="tk-face">' + bodySVG(o.hue, 22) + '</span>' +
          '<span class="tk-no">#' + o.no + '</span>' +
          '<span class="tk-time">--</span>' +
        '</div>' +
        '<div class="tk-items">' + orderItemsHTML(o) + '</div>' +
        '<div class="tk-pat"><i></i></div>' +
        '<button class="tk-go" data-go="' + o.id + '" disabled>缺</button>';
      e._lis  = [].slice.call(e.querySelectorAll('.li'));
      e._pat  = e.querySelector('.tk-pat i');
      e._time = e.querySelector('.tk-time');
      e._go   = e.querySelector('.tk-go');
      tkEls[o.id] = e;
      rail.appendChild(e);
    }
  });
  Object.keys(tkEls).forEach(function(id){
    if(!seen[id]){
      var e = tkEls[id];
      e.classList.add('going');
      (function(node){ setTimeout(function(){ if(node.parentNode) node.remove(); }, 300); })(e);
      delete tkEls[id];
    }
  });
  var none = rail.querySelector('.none');
  if(!S.orders.length && !none){
    var d = document.createElement('div');
    d.className = 'none'; d.textContent = '还没来客人…';
    rail.appendChild(d);
  } else if(S.orders.length && none) none.remove();
}

/* ── 出餐 ── */
function serve(id, x, y){
  var idx = -1;
  for(var i = 0; i < S.orders.length; i++) if(S.orders[i].id === id) idx = i;
  if(idx < 0) return;
  var o = S.orders[idx];
  var m = matchOrder(o);
  if(!m.every(function(x){ return x.ok; })){
    toast('还差：' + missText(m).replace('缺 ', ''));
    sfxBad(); return;
  }
  // 逐件从出餐架扣除（matchOrder 用的是副本，这里真扣）
  var qSum = 0;
  o.want.forEach(function(w){
    for(var k = 0; k < S.shelf.length; k++){
      if(S.shelf[k].code === w.code && S.shelf[k].sig === sig(w.toppings)){
        qSum += effQ(S.shelf[k]); S.shelf.splice(k, 1); break;
      }
    }
  });
  var avgQ = qSum / o.want.length;
  var base = o.want.reduce(function(a, w){ return a + ((DISH[w.code] && DISH[w.code].price) || 0); }, 0);
  /* Papa's 规矩：餐费照付，但只有做得好才有小费，做得糊弄一分小费都没有 */
  var tier = tipTier(avgQ);
  var tip = Math.round(base * tier.rate);
  var money = base + tip;

  S.cash += money;
  S.stats.revenue += base;
  S.stats.tips += tip;
  S.stats.served++;
  S.stats.qSum += avgQ; S.stats.qCount++;
  if(avgQ >= PERFECT_Q) S.stats.perfect++;
  o.want.forEach(function(w){ S.stats.items[w.code] = (S.stats.items[w.code] || 0) + 1; });

  renderShelf(); sfxCash();
  /* 等第挂在金额下面，不挂上面 —— 票架本来就在屏幕顶端，往上弹会顶进 HUD */
  popText(x, y + 19, tier.tag, tier.col);
  if(tip > 0) popText(x, y - 15, '+' + tip + ' 小费', COL.yellowD);
  popText(x, y, '+' + yen(money), COL.green);

  var e = tkEls[o.id];
  if(e){
    e.classList.add('going');
    setTimeout(function(){ if(e.parentNode) e.remove(); }, 300);
    delete tkEls[o.id];
  }
  S.orders.splice(idx, 1);
  renderTabs();
  syncOrders();           // 同步清理：拖到 setTimeout 会留下可点的幽灵卡
  if(S.tab === 'assembly') renderBench();
}

/* ── 主循环 ── */
function loop(now){
  raf = requestAnimationFrame(loop);
  if(!lastT) lastT = now;
  var dt = Math.min(90, now - lastT);
  lastT = now;
  if(S && S.phase === 'running'){ update(dt); paint(); }
}
function update(dt){
  S.timeLeft -= dt;
  S.tNow += dt;
  if(S.timeLeft <= 0){ endDay(); return; }

  for(var i = 0; i < S.slots.length; i++){
    var s = S.slots[i];
    if(s.st === 'frying'){
      s.t += dt;
      if(s.t >= FRYER.ms){ s.st = 'burnt'; s.t = FRYER.ms; }
    }
  }
  for(var q = 0; q < S.baskets.length; q++){
    var bs = S.baskets[q];
    if(bs.st === 'frying'){
      bs.t += dt;
      if(bs.t >= BASKET.ms){ bs.st = 'burnt'; bs.t = BASKET.ms; }
    }
  }
  for(var g = 0; g < S.grill.length; g++){
    var gr = S.grill[g];
    if(gr.st === 'cook'){
      gr.t += dt;
      if(gr.t >= GRILL.sideMs){ gr.st = 'burnt'; gr.t = GRILL.sideMs; }
    }
  }
  if(S.cup.pouring){
    S.cup.fill += dt / DRINK.ms;
    if(S.cup.fill >= 1){ S.cup.fill = 1; S.cup.pouring = false; finishPour(); }
  }

  S.spawnAcc += dt;
  while(S.spawnAcc >= S.cfg.interval){
    S.spawnAcc -= S.cfg.interval;
    if(S.orders.length < MAX_ORDERS) spawnOrder();
  }

  var gone = [];
  for(var j = 0; j < S.orders.length; j++){
    S.orders[j].patience -= dt;
    if(S.orders[j].patience <= 0) gone.push(S.orders[j].id);
  }
  if(gone.length){
    gone.forEach(function(id){
      var ix = -1;
      for(var m = 0; m < S.orders.length; m++) if(S.orders[m].id === id) ix = m;
      if(ix >= 0) S.orders.splice(ix, 1);
      S.stats.lost++; sfxBad();
    });
    renderTabs(); syncOrders();
    if(S.tab === 'assembly') renderBench();
  }
}
function spawnOrder(){
  S.orders.push({
    id: uid, no: uid++,
    want: makeOrderWant(S.day),
    patience: S.cfg.patience, max: S.cfg.patience,
    hue: (Math.random() * 360) | 0
  });
  renderTabs(); syncOrders();
  if(S.tab === 'assembly') renderBench();
}

/* ════════════════ 每帧刷新 ════════════════ */
function paint(){
  if(!S || S.phase !== 'running') return;
  var t = el('hTime'); if(!t) return;
  t.textContent = Math.max(0, Math.ceil(S.timeLeft / 1000));
  var tb = el('hTimeBox');
  if(tb) tb.className = 'it' + (S.timeLeft < 10000 ? ' warn' : '');
  var hc = el('hCash'); if(hc) hc.textContent = yen(S.cash);
  var hs = el('hServed'); if(hs) hs.textContent = S.stats.served;

  S.orders.forEach(function(o){
    var e = tkEls[o.id]; if(!e) return;
    var m = matchOrder(o);
    for(var i = 0; i < m.length; i++){
      var node = e._lis[i];
      if(!node) continue;
      var cls = 'li ' + (m[i].ok ? 'ok' : 'miss');
      if(node.className !== cls) node.className = cls;
    }
    var okAll = m.every(function(x){ return x.ok; });
    if(okAll !== e._ready){
      e._ready = okAll;
      e.classList.toggle('ready', okAll);
      e._go.disabled = !okAll;
    }
    var label = okAll ? '出餐' : missText(m);
    if(e._go.textContent !== label) e._go.textContent = label;

    var r = clamp(o.patience / o.max, 0, 1);
    if(e._pat){
      e._pat.style.width = (r * 100) + '%';
      e._pat.style.background = r > 0.5 ? COL.greenL : r > 0.25 ? COL.amber : COL.red;
    }
    var sec = Math.ceil(o.patience / 1000);
    if(e._time.textContent !== sec + 's') e._time.textContent = sec + 's';
    var hot = r < 0.3;
    if(hot !== e._hot){ e._hot = hot; e.classList.toggle('hot', hot); }
  });

  paintBadges();
  paintShelf();
  if(S.tab === 'fries')       paintFries();
  else if(S.tab === 'basket') paintBasket();
  else if(S.tab === 'drink')  paintDrink();
  else if(S.tab === 'grill')  paintGrill();
}

function paintFries(){
  for(var i = 0; i < S.slots.length; i++){
    var s = S.slots[i];
    var node = app.querySelector('[data-slot="' + i + '"]');
    if(!node) continue;
    var ratio = s.st === 'burnt' ? 1 : clamp(s.t / FRYER.ms, 0, 1);
    var fill = node.querySelector('.fill');
    if(fill) fill.style.width = (ratio * 100) + '%';

    var col = COL.raw;
    if(s.st === 'burnt') col = COL.burnt;
    else if(s.st === 'frying' && ratio >= FRYER.rawUntil) col = COL.yellow;
    var sticks = node.querySelectorAll('.stick');
    for(var k = 0; k < sticks.length; k++) sticks[k].style.background = col;

    var wrap = node.querySelector('.frywrap');
    if(wrap) wrap.style.opacity = (s.st === 'idle') ? '0.26' : '1';

    var lbl = node.querySelector('.lbl'), lbl2 = node.querySelector('.lbl2');
    var snm = node.querySelector('.slotnm'), sbig = node.querySelector('.slotbig');
    var cls = 'slot';
    var nm = s.code && DISH[s.code] ? (DISH[s.code].short || '') : '';
    if(snm) snm.textContent = (s.st === 'idle') ? '' : nm;
    if(sbig){
      sbig.textContent = s.st === 'idle' ? '点一下下料'
        : s.st === 'burnt' ? '焦'
        : ratio < FRYER.rawUntil ? ((FRYER.ms - s.t) / 1000).toFixed(1) + 's'
        : '捞出';
    }
    if(s.st === 'idle'){ cls += ' idle'; if(lbl) lbl.textContent = '空'; if(lbl2) lbl2.textContent = '从上面选品'; }
    else if(s.st === 'frying'){
      if(ratio < FRYER.rawUntil){
        cls += ' frying';
        if(lbl) lbl.textContent = nm + ' ' + ((FRYER.ms - s.t)/1000).toFixed(1) + 's';
        if(lbl2) lbl2.textContent = '再等等';
      } else {
        cls += ' ready';
        if(lbl) lbl.textContent = '可以捞！';
        if(lbl2) lbl2.textContent = nm + ' · 点一下出锅';
      }
    } else if(s.st === 'burnt'){
      cls += ' burnt';
      if(lbl) lbl.textContent = '焦了';
      if(lbl2) lbl2.textContent = nm + ' · 点一下清锅';
    }
    if(node.className !== cls) node.className = cls;
  }
}

function paintDrink(){
  var cup = el('cupFill');
  if(!cup) return;
  var cupEl = cup.parentNode;
  // 用 px 而不是 %：绝对定位元素的百分比高度依赖包含块高度，实测在 flex 里
  // 会被算成 0（inline 写着 36%，computed 一直是 0px，液面永远不显示）。px 没有这个坑。
  var ch0 = cupEl ? cupEl.clientHeight : 0;
  cup.style.height = Math.round(clamp(S.cup.fill, 0, 1) * ch0) + 'px';
  var mark = el('cupMark');
  if(mark && cupEl){
    var ch = cupEl.offsetHeight;
    if(ch && mark._h !== ch){
      mark._h = ch;
      mark.style.bottom = Math.round((DRINK.low + DRINK.high) / 2 * ch) + 'px';
    }
  }
  var tap = el('tap');
  if(!tap) return;
  var mode = !S.cup.pouring ? 'idle'
           : (S.cup.fill >= DRINK.low && S.cup.fill <= DRINK.high ? 'ready' : 'on');
  if(tap.getAttribute('data-m') !== mode){
    // 用 data-m 记状态，而不是看 className：
    // finishPour() 会直接把 className 重置回 'tap'，靠 class 比对会漏掉这一帧，文字就永远停在上一次
    tap.setAttribute('data-m', mode);
    tap.className = 'tap' + (mode === 'idle' ? '' : ' ' + mode);
    var d = DISH[picked.drink] || {};
    var pct0 = Math.round(S.cup.fill * 100);
    tap.innerHTML =
      mode === 'ready' ? '松手！<b>刚好 <span id="pourPct">' + pct0 + '%</span></b>' :
      mode === 'on'    ? '注杯中…<b id="pourPct">' + pct0 + '%</b>' :
                         '按住注杯 <b>绿区松手 · ' + esc(d.short || '') + '</b>';
  } else if(mode === 'on' || mode === 'ready'){
    /* 绿区里也要继续显示百分比：只写"刚好"的话，玩家没法知道自己离正中还差多少。
       绿区本身有 23% 宽，靠肉眼估液面高度太玄了。 */
    var pct = el('pourPct');
    if(pct) pct.textContent = Math.round(S.cup.fill * 100) + '%';
  }
}

/* ════════════════ 打烊 ════════════════ */
function endDay(){
  S.phase = 'dayend';
  var st = S.stats;
  var rent = (ECON.rent || 50) + (S.day - 1) * (ECON.rentStep || 18);
  var lostPay = (st.lost || 0) * (ECON.lostPenalty || 12);
  st.lostPay = lostPay;
  var profit = st.revenue + st.tips - st.cost - rent - lostPay;
  S.cash -= rent + lostPay;
  S.history.push({ day:S.day, revenue:st.revenue, tips:st.tips, cost:st.cost,
                   rent:rent, lostPay:lostPay, profit:profit, cash:S.cash,
                   served:st.served, lost:st.lost });
  if(S.cash < 0) return renderBankrupt();
  renderDayEnd(profit, rent, lostPay);
}

function renderDayEnd(profit, rent, lostPay){
  var st = S.stats;
  var sold = Object.keys(st.items).reduce(function(a,k){ return a + st.items[k]; }, 0);
  var items = Object.keys(st.items).map(function(k){
    var d = DISH[k]; return ((d && (d.short || d.name)) || k) + ' ×' + st.items[k];
  }).join('　') || '一件都没卖出去';
  var traffic = st.served + st.lost;
  var rate = traffic ? Math.round(st.served / traffic * 100) : 0;
  var avgQ = st.qCount ? st.qSum / st.qCount : 0;

  app.innerHTML =
  '<div class="sheet">' +
    '<div><h1>第 ' + S.day + ' 天 · 打烊</h1><p class="sub" style="margin-top:6px">' + esc(items) + '</p></div>' +
    '<div class="card">' +
      '<div class="row"><span class="k">接待顾客</span><span class="v">' + st.served + ' / ' + traffic + ' 位</span></div>' +
      '<div class="row"><span class="k">服务率</span><span class="v ' + (rate >= 80 ? 'pos' : rate < 60 ? 'neg' : '') + '">' + rate + '%</span></div>' +
      '<div class="row"><span class="k">卖出</span><span class="v">' + sold + ' 件</span></div>' +
      '<div class="row"><span class="k">完美出品</span><span class="v ' + (st.perfect ? 'pos' : '') + '">' + st.perfect + ' 单</span></div>' +
      '<div class="row"><span class="k">平均出品</span><span class="v ' + (avgQ >= PERFECT_Q ? 'pos' : avgQ < GOOD_Q ? 'neg' : '') + '">' + (st.qCount ? Math.round(avgQ * 100) + ' 分' : '—') + '</span></div>' +
      '<div class="row"><span class="k">跑掉的顾客</span><span class="v ' + (st.lost ? 'neg' : '') + '">' + st.lost + ' 位</span></div>' +
      '<div class="row"><span class="k">炸糊 / 倒掉</span><span class="v ' + ((Number(st.burnt) + Number(st.wasted)) ? 'neg' : '') + '">' + (Number(st.burnt) + Number(st.wasted)) + ' 份</span></div>' +
      '<div class="row"><span class="k">营业收入</span><span class="v pos">' + yen(st.revenue) + '</span></div>' +
      (st.tips ? '<div class="row"><span class="k">小费</span><span class="v pos">' + yen(st.tips) + '</span></div>' : '') +
      '<div class="row"><span class="k">原料成本</span><span class="v neg">' + signedYen(-st.cost) + '</span></div>' +
      '<div class="row"><span class="k">房租</span><span class="v neg">' + signedYen(-rent) + '</span></div>' +
      (lostPay ? '<div class="row"><span class="k">跑单赔偿</span><span class="v neg">' + signedYen(-lostPay) + '</span></div>' : '') +
      '<div class="row big"><span class="k">今日净利</span><span class="v ' + (profit >= 0 ? 'pos' : 'neg') + '">' + signedYen(profit) + '</span></div>' +
      '<div class="row"><span class="k">现金余额</span><span class="v">' + yen(S.cash) + '</span></div>' +
    '</div>' +
    '<button class="btn" id="nx" style="min-width:200px">' +
      (S.day >= (ECON.days||5) ? '看总账' : '进入第 ' + (S.day + 1) + ' 天') +
    '</button>' +
  '</div>';

  el('nx').addEventListener('click', function(){
    if(S.day >= (ECON.days||5)){ renderOver(); return; }
    S.day++; startDay();
  });
}

function renderBankrupt(){
  app.innerHTML =
  '<div class="sheet">' +
    '<div><h1 style="color:var(--red)">破产了</h1>' +
    '<p class="sub" style="margin-top:8px">第 ' + S.day + ' 天收摊，账上见底。<br>下手再稳一点，别把料做废了。</p></div>' +
    '<button class="btn" id="rs" style="min-width:200px">从头再来</button>' +
  '</div>';
  el('rs').addEventListener('click', function(){ S = newState(); renderTitle(); });
}

function renderOver(){
  var total = S.history.reduce(function(a,h){ return a + h.profit; }, 0);
  var served = S.history.reduce(function(a,h){ return a + h.served; }, 0);
  var lost = S.history.reduce(function(a,h){ return a + h.lost; }, 0);
  var cash = S.cash;
  var G = ECON.grades || { S:1050, A:930, B:800, C:650 };
  var g, note;
  if(cash >= G.S)      { g='S'; note='这店你开出了名堂。'; }
  else if(cash >= G.A) { g='A'; note='稳，火候拿得住。'; }
  else if(cash >= G.B) { g='B'; note='小赚，路子对了。'; }
  else if(cash >= G.C) { g='C'; note='白忙一场，好歹没亏。'; }
  else                 { g='D'; note='钱少了，手艺还得练。'; }
  var best = S.history.slice().sort(function(a,b){ return b.profit - a.profit; })[0];

  app.innerHTML =
  '<div class="sheet">' +
    '<div class="grade">' + g + '</div>' +
    '<p class="sub">' + note + '</p>' +
    '<div class="card">' +
      '<div class="row"><span class="k">经营天数</span><span class="v">' + S.history.length + ' 天</span></div>' +
      '<div class="row"><span class="k">累计净利</span><span class="v ' + (total >= 0 ? 'pos' : 'neg') + '">' + signedYen(total) + '</span></div>' +
      '<div class="row"><span class="k">共接待</span><span class="v">' + served + ' 位 · 跑掉 ' + lost + ' 位</span></div>' +
      '<div class="row"><span class="k">最好的一天</span><span class="v">第 ' + (best ? best.day : 1) + ' 天 · ' + (best ? signedYen(best.profit) : '—') + '</span></div>' +
      '<div class="row big"><span class="k">最终现金</span><span class="v">' + yen(cash) + '</span></div>' +
    '</div>' +
    '<button class="btn" id="rs" style="min-width:200px">再开一局</button>' +
  '</div>';
  el('rs').addEventListener('click', function(){ S = newState(); renderTitle(); });
}

/* ════════════════ 启动 ════════════════ */
S = newState();
renderTitle();

/* 全局只绑一次：松手即结束注液 */
window.addEventListener('pointerup', function(){
  if(S && S.cup.pouring){ S.cup.pouring = false; finishPour(); }
});
window.addEventListener('pointerdown', function once(){
  window.removeEventListener('pointerdown', once);
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
}, { once: true });

})();
</script>
</body>
</html>
